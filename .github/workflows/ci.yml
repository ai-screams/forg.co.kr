name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref when a new run starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Force JavaScript actions (checkout, setup-node, pnpm/action-setup, etc.) to
# run on Node.js 24 ahead of GitHub's 2026-06-02 default switch. Removes the
# Node 20 deprecation warning and surfaces any incompatibility now rather than
# on switchover day. Drop this env once these actions ship v5 with Node 24
# baked in (expected before 2026-09-16 Node 20 removal).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # The site is not built here. Cloudflare Pages builds every push (its check
  # on the PR), and the same build on this 2-core runner took 11 of 15
  # minutes: page generation gets one worker, writing and pruning ~195,000
  # export files is slow, and the disk had to be cleared first
  # (2026-10-06). `pnpm build` and `pnpm size` still run locally.
  quality:
    name: Quality (lint · typecheck · test · format · knip)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint (ESLint)
        run: pnpm run lint

      - name: Lint (Markdown)
        run: pnpm run lint:md

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests (Vitest)
        run: pnpm run test

      - name: Secret scan (Secretlint)
        run: pnpm run secret

      - name: Find unused code (Knip)
        run: pnpm run knip
        continue-on-error: true # advisory; do not fail CI yet

  etl:
    name: ETL tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/etl/requirements.txt

      - name: Install ETL dependencies
        run: pip install -r scripts/etl/requirements.txt

      - name: Unit and parser tests
        run: python -m pytest scripts/etl/tests -q

  commitlint:
    name: Commit message lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate PR commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
