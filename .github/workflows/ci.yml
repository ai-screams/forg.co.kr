name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref when a new run starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Force JavaScript actions (checkout, setup-node, pnpm/action-setup, etc.) to
# run on Node.js 24 ahead of GitHub's 2026-06-02 default switch. Removes the
# Node 20 deprecation warning and surfaces any incompatibility now rather than
# on switchover day. Drop this env once these actions ship v5 with Node 24
# baked in (expected before 2026-09-16 Node 20 removal).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    name: Quality (lint · typecheck · format · build · knip · size)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint (ESLint)
        run: pnpm run lint

      - name: Lint (Markdown)
        run: pnpm run lint:md

      - name: Typecheck
        run: pnpm run typecheck

      - name: Secret scan (Secretlint)
        run: pnpm run secret

      - name: Build
        run: pnpm run build

      - name: Find unused code (Knip)
        run: pnpm run knip
        continue-on-error: true # advisory; do not fail CI yet

      - name: Bundle size budget
        run: pnpm run size
        continue-on-error: true # advisory; ratchet later

  commitlint:
    name: Commit message lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate PR commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
